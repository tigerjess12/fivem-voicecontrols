name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: pip install faster-whisper numpy sounddevice pyinstaller

      - name: Build Lite and Full packages
        shell: pwsh
        run: ./scripts/build-release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release/*.streamDeckPlugin
            release/listener-windows.zip

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.streamDeckPlugin
            release/listener-windows.zip
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
